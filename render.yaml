services:
  - type: web
    name: taiwan-assistant-mcp
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn web_app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: CORS_ORIGINS
        value: https://luboblu.github.io,http://localhost:8000,http://127.0.0.1:8000
